appId: app.vervein
# Not run in CI yet (see maestro.yml's own comment) -- assumes an
# already-onboarded, signed-in profile, which a genuinely fresh CI install
# never has. Local-dev-only until a test-account-seeding mechanism exists.
---
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      text: "Good .*|Welcome|Continue|Go home"
    timeout: 15000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Go home"
    commands:
      - tapOn: "Go home"

- assertVisible: "Summary"
- takeScreenshot: tab-summary

- tapOn: "Train"
- extendedWaitUntil:
    visible:
      text: ".*"
    timeout: 5000
- takeScreenshot: tab-train

- tapOn: "Progress"
- assertVisible: "STRENGTH PROGRESS"
- takeScreenshot: tab-progress

- tapOn: "Profile"
- extendedWaitUntil:
    visible:
      text: ".*"
    timeout: 5000
- takeScreenshot: tab-profile

- tapOn: "Summary"
- assertVisible: "Good .*"
- takeScreenshot: tab-back-to-summary

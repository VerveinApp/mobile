appId: app.vervein
# Needs an already-onboarded, signed-in profile, which a genuinely fresh CI
# install never has -- openLink below seeds one via app/e2e-seed.tsx (a
# no-op everywhere EXPO_PUBLIC_E2E_SEED_ENABLED isn't explicitly set, i.e.
# everywhere except maestro.yml's own CI run and an opted-in local dev env).
---
- stopApp
- launchApp:
    clearState: false
- openLink: "vervein://e2e-seed"
# A fresh simulator that's never been asked before shows a real system
# "Open in 'VerveIn'?" confirmation before actually following a custom URL
# scheme link -- doesn't reproduce once a given simulator has been asked
# and answered once (which is why this never showed up in local testing on
# an already-used dev simulator), but a genuinely fresh CI simulator hits
# it every time. Guarded, not required, since dismissed-once devices skip
# straight past it.
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
# 15000ms was tight specifically here: this is the first flow in the whole
# suite to actually trigger the system "Open in 'VerveIn'?" dialog (smoke-
# launch never calls openLink at all), and CI runs 33793568696 and
# 33803132132 both showed this exact assertion failing here — dismissing
# that dialog alone ate ~8s of the budget in the log, leaving too little
# for the app to also finish relaunching and routing after it, especially
# under this runner's occasional software-rendered-GPU slowdowns (logged as
# "GL pipe is running in software mode"). Every later flow in the same
# simulator session never hits that dialog again once it's been dismissed
# once, which is exactly why they didn't show the same failure.
- extendedWaitUntil:
    visible:
      text: "Good .*|Welcome|Continue|Go home"
    timeout: 30000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Go home"
    commands:
      - tapOn: "Go home"

- assertVisible: "Summary"
- takeScreenshot: tab-summary

- tapOn: "Train"
- extendedWaitUntil:
    visible:
      text: ".*"
    timeout: 5000
- takeScreenshot: tab-train

- tapOn: "Progress"
- assertVisible: "STRENGTH PROGRESS"
- takeScreenshot: tab-progress

- tapOn: "Profile"
- extendedWaitUntil:
    visible:
      text: ".*"
    timeout: 5000
- takeScreenshot: tab-profile

- tapOn: "Summary"
- assertVisible: "Good .*"
- takeScreenshot: tab-back-to-summary

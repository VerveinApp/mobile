appId: app.vervein
# Two DISTINCT accessibility gaps were found and bisected in home/check-in.tsx:
#
# 1. FIXED: Pressable buttons that pair a native SymbolView icon with a
#    sibling <Text> (inside an Animated.View) never got an implicit
#    accessibility label — RN's automatic label derivation breaks on the
#    icon sibling. Fixed with explicit accessibilityRole="button" +
#    accessibilityLabel on "Watch form", "How to", and "Swap". These are now
#    real, working text selectors (see the "Swap" step below).
#
# 2. STILL BROKEN, not fixed (no safe narrow fix found): content gated
#    behind a conditional that flips from false→true shortly AFTER initial
#    mount (not present in the first commit) never registers in the iOS
#    accessibility tree, even though it renders and responds to touch
#    normally. This affects the Rest Day heading/"Check in anyway" link
#    (showRestDay flips true once the async profile load resolves) and the
#    "Swap this exercise" Modal's own title/body text (gated by
#    swapModalIndex, set after the Swap tap). This looks like a genuine
#    Fabric/iOS accessibility-tree timing gap, not an app bug with an
#    obvious fix — forcing one (remount tricks, native re-scan triggers)
#    risked breaking the real fade animations, so it was left alone.
#    Coordinate taps (point:) remain the working fallback for these two spots.
#
# Needs an already-onboarded, signed-in profile, which a genuinely fresh CI
# install never has -- openLink below seeds one via app/e2e-seed.tsx (a
# no-op everywhere EXPO_PUBLIC_E2E_SEED_ENABLED isn't explicitly set, i.e.
# everywhere except maestro.yml's own CI run and an opted-in local dev env).
#
# NOTE: the point: taps below were calibrated against an iPhone 11 Pro Max
# locally, not any device available on a GitHub runner (see maestro.yml's
# own device-selection comment). They're percentage-based so should scale
# reasonably, but haven't been verified against the actual CI device yet --
# the next real CI run against this flow is the first real signal on that.
---
- stopApp
- launchApp:
    clearState: false
- openLink: "vervein://e2e-seed"
# A fresh simulator that's never been asked before shows a real system
# "Open in 'VerveIn'?" confirmation before actually following a custom URL
# scheme link -- see tab-navigation.yaml's own comment on this.
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      text: "Good .*|Welcome|Continue|Go home"
    timeout: 15000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Go home"
    commands:
      - tapOn: "Go home"

- tapOn: "Train"
# Waits for the tab's own content to actually render before tapping into it
# — a bare tapOn right after a tab switch has no such guard and could race
# the transition under load. rest-day-checkin.yaml already waits the same
# way after its own identical "Train" tap; this just matches that.
- extendedWaitUntil:
    visible:
      text: "Rest day|Exercise 1 of .*|Check in & start|Strength Session"
    timeout: 10000
# Second "Check in anyway" (Rest Day full-screen state) — gap #2 above.
# Only exists when today lands on Rest Day for the seeded profile — CI run
# 33822805317 failed exactly here (misdiagnosed at the time as the same
# transition race the wait above guards against): it ran on 2026-09-04, a
# real Friday, and app/e2e-seed.tsx used to seed a fixed
# 'monday,wednesday,friday' schedule, so a real scheduled training day was
# shown instead of Rest Day — no "Check in anyway" link exists there at
# all, the tap failed for a reason with nothing to do with timing. Fixed at
# the source: e2e-seed.tsx now computes training days relative to whatever
# day it actually runs on, so they can never include today, and this flow
# genuinely depends on that guarantee rather than being restated here.
- tapOn: "Check in anyway"
- tapOn:
    point: "50%,40%"
- takeScreenshot: swap-flow-01-gauge
# The dial is now a horizontal 5-segment bar (redesigned from the original
# dome), 5 equal segments left-to-right Empty→Great. This point lands on the
# rightmost segment (Great/5) — chosen specifically because Energy 5 never
# grows the "Symptom tracking"/paywall card Energy 1 does, so "Start
# session" stays on-screen without needing a scroll. A short settle before
# this tap avoids a race with the rest-day dismissal's own transition still
# finishing.
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    point: "78%,40%"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: swap-flow-01b-energy-selected
# Real, observed non-determinism: selecting the segment sometimes lands
# directly on the workout screen already, sometimes still needs "Start
# session" tapped explicitly (a layout-timing race in the app itself, not
# this flow). Handled both ways instead of assuming either one.
- runFlow:
    when:
      notVisible: "Exercise 1 of .*"
    commands:
      - runFlow:
          when:
            visible: "Start session"
          commands:
            - tapOn: "Start session"
- extendedWaitUntil:
    visible:
      text: "Exercise 1 of .*"
    timeout: 10000
- takeScreenshot: swap-flow-02-workout
- tapOn: "Swap"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: swap-flow-03-sheet-open
# "Cancel" on the swap sheet — the Modal's own content is gap #2 above, so
# this verifies via screenshot rather than a text assertion.
- tapOn:
    point: "50%,54%"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: swap-flow-04-sheet-closed

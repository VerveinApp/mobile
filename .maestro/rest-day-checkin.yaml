appId: app.vervein
# Regression guard for the rest-day path specifically — content that first
# appears only after the async profile load resolves (never on the initial
# render). This is the exact case documented in home/check-in.tsx's own
# header comment as having a known, unresolved iOS accessibility-tree gap:
# VoiceOver and Maestro's own tapOn-by-accessibility-label can't reliably
# rediscover "Check in anyway" after it renders, despite it displaying and
# responding to touch normally. This flow only asserts the content is
# VISIBLE — it deliberately does not assert a tapOn: "Check in anyway" by
# label, since that's the documented, still-open broken interaction (see
# check-in.tsx for the full investigation history and what's already been
# tried and ruled out).
#
# Whether today lands on a rest day or a real training day depends on the
# signed-in profile's own scheduled days — this flow only asserts the
# rest-day content when that's what actually renders, rather than assuming
# it unconditionally, so it stays correct either way.
#
# Needs an already-onboarded, signed-in profile, which a genuinely fresh CI
# install never has -- openLink below seeds one via app/e2e-seed.tsx (a
# no-op everywhere EXPO_PUBLIC_E2E_SEED_ENABLED isn't explicitly set, i.e.
# everywhere except maestro.yml's own CI run and an opted-in local dev env).
# That seed used to hardcode 'monday,wednesday,friday' as the scheduled
# days, which made today land on Rest Day only 4 of 7 real calendar days —
# CI run 33822805317 (a real Friday) hit the other 3 and broke
# exercise-swap-sheet.yaml's own deliberate rest-day-override path, which
# does assume Rest Day unconditionally (see that flow's own comment).
# e2e-seed.tsx now computes scheduled days relative to whenever it actually
# runs, guaranteeing today is never one of them — this flow's own
# conditional branch means that change doesn't affect it either way, but
# it's what the exercise-swap-sheet.yaml flow actually depends on.
---
- launchApp:
    clearState: false
- openLink: "vervein://e2e-seed"
# A fresh simulator that's never been asked before shows a real system
# "Open in 'VerveIn'?" confirmation before actually following a custom URL
# scheme link -- see tab-navigation.yaml's own comment on this.
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      text: "Good .*|Continue|Go home"
    timeout: 15000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Go home"
    commands:
      - tapOn: "Go home"
- tapOn: "Train"
- extendedWaitUntil:
    visible:
      text: "Rest day|Exercise 1 of .*|Check in & start|Strength Session"
    timeout: 8000
- runFlow:
    when:
      visible: "Rest day"
    commands:
      - assertVisible: "Rest day"
      - assertVisible: "Check in anyway"
      - takeScreenshot: rest-day-reachable

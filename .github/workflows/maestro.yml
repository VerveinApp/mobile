name: Maestro E2E

# Manual trigger only, deliberately not on every push/PR: this needs a
# macOS runner (billed at a much higher rate than the JS-only CI job) and a
# full native iOS build + simulator boot, which is slow and — for a first
# version of this pipeline — more likely to need a few real iterations to
# get stable than something worth blocking every commit on.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: macos-26
    # Run 11 was still mid-build at the 45-minute mark and got cancelled by
    # the job timeout, not a real failure -- a cold Release build with full
    # optimization across this dependency tree (RevenueCat, HealthKit,
    # GoogleSignIn, Reanimated, etc.) is much slower than the Debug build
    # that finished around 11 minutes. No caching yet, so budget generously.
    timeout-minutes: 90
    # An unspecified shell defaults to `bash -e {0}` with pipefail OFF, so a
    # failure partway through a pipeline (e.g. `curl ... | bash`, or a grep
    # that legitimately finds nothing) can be silently swallowed by whatever
    # runs last in the pipe. Explicit `shell: bash` switches GitHub Actions
    # to `bash --noprofile --norc -eo pipefail {0}` for every run step.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # Run 5 failed on Xcode 16.4 (Swift 6.1): SPM manifest needs 6.2.
      # Runs 6 and 7 tried Xcode 26.3 and 26.0 (the macos-15 runner's full
      # range) -- both hit real compiler errors in expo-modules-jsi's
      # Swift/C++ interop code (RuntimeScheduler.h SWIFT_RETURNS_RETAINED,
      # and several "'weak' must be a mutable variable" errors), not a
      # config issue but a genuine incompatibility with that whole Xcode
      # generation as shipped on this runner. Local builds all session
      # were on Xcode 26.6, newer than anything macos-15 offers. Trying the
      # macos-26 runner label on the theory it carries a newer Xcode set.
      - name: Select latest available Xcode
        run: |
          ls /Applications | grep -i xcode || true
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST_XCODE" ]; then
            echo "::error::No /Applications/Xcode_*.app found -- runner image naming convention may have changed"
            exit 1
          fi
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # These are documented as public/client-embeddable (not secrets) in
      # .env.example — see that file's own header comment. Stored as repo
      # Variables, not Secrets, to match that.
      - name: Write .env.local
        run: |
          cat <<EOF > .env.local
          EXPO_PUBLIC_SUPABASE_URL=${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_REVENUECAT_API_KEY_IOS=${{ vars.EXPO_PUBLIC_REVENUECAT_API_KEY_IOS }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EOF

      - name: Set up Java (Maestro requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro
        run: |
          curl -Lfs "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios

      - name: Boot simulator and build + install the app
        run: |
          # The coordinate-based taps in exercise-swap-sheet.yaml/
          # rest-day-checkin.yaml were tuned against an "iPhone 11 Pro Max"
          # locally -- not available on any GitHub runner image. The
          # macos-15 runner had "iPhone 16" but not "iPhone 17"; the
          # macos-26 runner has the reverse (its catalog dropped plain
          # "iPhone 16" entirely once 17-series simulators showed up).
          # Try a priority list instead of one hardcoded model so this
          # survives the next runner image's device-catalog churn too.
          xcrun simctl list devices available
          UDID=""
          for MODEL in "iPhone 17" "iPhone 16" "iPhone 17 Pro" "iPhone Air" "iPhone 16e"; do
            # `|| true`: under this job's `-eo pipefail`, a MODEL that isn't
            # present makes this whole pipeline (and the bare assignment
            # that captures it) exit non-zero -- which would otherwise kill
            # the entire step on the very first non-match, never trying the
            # rest of the priority list.
            UDID=$(xcrun simctl list devices available | grep -E "^ *${MODEL} \(" | tail -1 | grep -oE '[0-9A-F-]{36}') || true
            if [ -n "$UDID" ]; then
              echo "Matched model: $MODEL"
              break
            fi
          done
          if [ -z "$UDID" ]; then
            echo "::error::None of the candidate simulator models were found on this runner"
            exit 1
          fi
          echo "Selected UDID: $UDID"
          xcrun simctl bootstatus "$UDID" -b
          open -a Simulator --args -CurrentDeviceUDID "$UDID"

          # expo run:ios (both with and without an explicit --device) kept
          # mis-resolving this as a physical-device build and demanding
          # code signing certs ("No code signing certificates are available
          # to use"), even with a simulator confirmed booted. Building
          # directly via xcodebuild against the booted simulator's UDID
          # sidesteps that device-resolution path entirely; the app's own
          # "Bundle React Native code and images" build phase still runs as
          # part of this, producing the same embedded JS bundle expo
          # run:ios would have.
          #
          # Release, not Debug: run 10 tried Debug specifically to dodge
          # RevenueCat's "Wrong API Key" guard, but this project has
          # expo-dev-client installed, so a Debug build boots the dev-client
          # launcher shell ("Searching for development servers...") instead
          # of the real app -- it needs a live Metro server that doesn't
          # exist in CI, so all 5 flows failed. Release is the only
          # configuration that produces a standalone, embedded-bundle app;
          # EXPO_PUBLIC_REVENUECAT_API_KEY_IOS is now the real production
          # key (see .env.local), which doesn't trip that guard.
          xcodebuild \
            -workspace ios/VerveIn.xcworkspace \
            -scheme VerveIn \
            -configuration Release \
            -destination "id=$UDID" \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP_PATH=$(find ios/build/Build/Products -maxdepth 2 -iname "VerveIn.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Built VerveIn.app not found under ios/build/Build/Products"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"

      - name: Run Maestro flows
        run: |
          # Only smoke-launch for now. Runs 9/10/12 all revealed the same
          # root cause: tab-navigation, rest-day-checkin, exercise-swap-sheet,
          # and progress-photo-add all assume an already-onboarded, signed-in
          # profile -- true of every simulator used for local dev this
          # session, never true of a genuinely fresh CI install (no cached
          # AsyncStorage, no cached Supabase session). smoke-launch's own
          # assertion was widened to accept "Get started", the real
          # first-launch screen; the other 4 need a real signed-in fixture
          # to reach anything past it, which doesn't exist yet -- see the
          # tracking work to add a test-only account-seeding mechanism.
          # Re-add them here once that lands.
          FAILED=0
          for flow in smoke-launch; do
            # `if ! ...` (not a bare command) so one flow failing doesn't
            # abort the loop under -e -- every flow should get a chance to
            # run and report, not just whichever one happens to be first.
            if ! maestro test ".maestro/$flow.yaml"; then
              echo "::error::Flow failed: $flow"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-output
          path: ~/.maestro/tests
          retention-days: 7

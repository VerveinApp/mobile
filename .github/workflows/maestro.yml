name: Maestro E2E

# Manual trigger only, deliberately not on every push/PR: this needs a
# macOS runner (billed at a much higher rate than the JS-only CI job) and a
# full native iOS build + simulator boot, which is slow and — for a first
# version of this pipeline — more likely to need a few real iterations to
# get stable than something worth blocking every commit on.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Run 5 failed on Xcode 16.4 (Swift 6.1): "package 'apple' is using
      # Swift tools version 6.2.0 but the installed version is 6.1.0".
      # Run 6 then tried the newest available Xcode (26.3) instead, which
      # got past that but hit a different, real compiler error in
      # expo-modules-jsi's C++/Swift interop header (RuntimeScheduler.h
      # SWIFT_RETURNS_RETAINED/SWIFT_SHARED_REFERENCE) -- a stricter check
      # that a later 26.x point release introduced, which that package
      # wasn't built against. Xcode 26.0 is the oldest available release
      # that should still satisfy the >=6.2 Swift tools requirement without
      # that newer, stricter diagnostic.
      - name: Select Xcode 26.0
        run: |
          ls /Applications | grep -i xcode
          sudo xcode-select -s /Applications/Xcode_26.0.app
          xcodebuild -version

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # These are documented as public/client-embeddable (not secrets) in
      # .env.example — see that file's own header comment. Stored as repo
      # Variables, not Secrets, to match that.
      - name: Write .env.local
        run: |
          cat <<EOF > .env.local
          EXPO_PUBLIC_SUPABASE_URL=${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_REVENUECAT_API_KEY_IOS=${{ vars.EXPO_PUBLIC_REVENUECAT_API_KEY_IOS }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EOF

      - name: Set up Java (Maestro requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios

      - name: Boot simulator and build + install the app
        run: |
          # The coordinate-based taps in exercise-swap-sheet.yaml/
          # rest-day-checkin.yaml were tuned against an "iPhone 11 Pro Max"
          # locally, but GitHub's macOS runner images don't carry that model
          # (confirmed: their available list only goes down to the 16
          # family / SE 3rd gen). Anchored on "iPhone 16 (" specifically
          # (not "iPhone 16 Pro"/"Plus"/"16e") so the match is exact, and
          # take the last (newest iOS runtime) match. If the flows'
          # percentage-based taps land wrong on this device's different
          # aspect ratio, that's the next thing to debug.
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available | grep -E '^ *iPhone 16 \(' | tail -1 | grep -oE '[0-9A-F-]{36}')
          echo "Selected UDID: $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$UDID" -b
          open -a Simulator --args -CurrentDeviceUDID "$UDID"

          # expo run:ios (both with and without an explicit --device) kept
          # mis-resolving this as a physical-device build and demanding
          # code signing certs ("No code signing certificates are available
          # to use"), even with a simulator confirmed booted. Building
          # directly via xcodebuild against the booted simulator's UDID
          # sidesteps that device-resolution path entirely; the app's own
          # "Bundle React Native code and images" build phase still runs as
          # part of this, producing the same embedded JS bundle expo
          # run:ios would have.
          xcodebuild \
            -workspace ios/VerveIn.xcworkspace \
            -scheme VerveIn \
            -configuration Release \
            -destination "id=$UDID" \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP_PATH=$(find ios/build/Build/Products -maxdepth 2 -iname "VerveIn.app" | head -1)
          echo "APP_PATH=$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" app.vervein

      - name: Run Maestro flows
        run: |
          for flow in smoke-launch tab-navigation rest-day-checkin exercise-swap-sheet progress-photo-add; do
            maestro test ".maestro/$flow.yaml"
          done

      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-output
          path: ~/.maestro/tests
          retention-days: 7
